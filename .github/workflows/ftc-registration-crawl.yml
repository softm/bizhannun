name: Expand FTC registration JSON (database-free)

on:
  workflow_dispatch:
  schedule:
    # Four independent data-only batches each day, Asia/Seoul 09:09, 15:09, 21:09, 03:09.
    # Pages' separate 06:17 KST schedule performs the website deployment once daily.
    - cron: '9 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: ftc-registration-json-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Synchronize main
        run: git pull --ff-only origin main

      - name: Install dependencies
        run: npm ci

      - name: Test official JSON collection and search
        run: node --test tests/registration-pages.test.mjs tests/registration-catalog.test.mjs tests/registration-link.test.mjs

      - name: Collect next official FTC pages (max 120)
        env:
          FTC_SERVICE_KEY: ${{ secrets.FTC_SERVICE_KEY }}
          FTC_PAGES_PER_RUN: '120'
        run: node scripts/collect-business-number-pages.mjs

      - name: Validate every public registration JSON file
        if: hashFiles('data/business-numbers/manifest.json') != ''
        run: node scripts/validate-registration-catalog.mjs

      - name: Commit data-only JSON updates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::main changed while collecting. Skip unsafe data update."
            exit 1
          fi
          git add -- data/business-number-status.json
          if [[ -d data/business-numbers ]]; then
            git add -- data/business-numbers/
          fi
          if git diff --cached --quiet; then
            echo "No new public registration data to publish."
            exit 0
          fi
          while IFS= read -r path; do
            if [[ "$path" != "data/business-number-status.json" && ! "$path" =~ ^data/business-numbers/(manifest\.json|routing\.json\.gz|shards/[0-9]{5}\.json\.gz)$ ]]; then
              echo "Invalid public data path: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): expand official business registration JSON"
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger another Pages build.
          # Existing daily Pages workflow deploys the latest accumulated snapshot.

      - name: Report collector coverage and errors
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          let status = {};
          try { status = JSON.parse(await readFile('data/business-number-status.json','utf8')); }
          catch { status = {status:'failed',message:'Missing collection status file'}; }
          const lines = [
            '### Official FTC business registration JSON',
            '- Status: '+(status.status || 'unknown'),
            '- Verified public records: '+(status.recordCount || 0),
            '- Upstream source rows: '+(status.sourceTotal || 'unknown'),
            '- Next page: '+(status.nextPageNo || 'unknown'),
            '- Fully collected: '+(status.complete === true ? 'yes' : 'no'),
            '- Last successful snapshot: '+(status.lastSuccessAt || 'none'),
            '- Error: '+(status.message || 'none'),
          ];
          await appendFile(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          if(status.status === 'failed' || status.status === 'not_configured'){
            console.error('::error::Official registration collector did not obtain new data: '+(status.message||status.status));
            process.exitCode=1;
          }
          NODE
